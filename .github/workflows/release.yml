name: Linux release binaries

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            smoke: "[]"
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            smoke: "[]"
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-24.04
            smoke: '["qemu-arm"]'
          - target: riscv64gc-unknown-linux-musl
            os: ubuntu-24.04
            smoke: '["qemu-riscv64"]'
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      LDU_TARGET: ${{ matrix.target }}
      LDU_SMOKE_RUNNER: ${{ matrix.smoke }}
      # The Rust target supplies its musl CRT; no external musl cross toolchain is needed.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: rust-lld
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C link-self-contained=yes"
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C link-self-contained=yes"
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_RUSTFLAGS: "-C link-self-contained=yes"
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      # RISC-V musl does not enable crt-static by default.
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C target-feature=+crt-static -C link-self-contained=yes"
    steps:
      - name: Check out the source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install the emulator
        if: matrix.target == 'armv7-unknown-linux-musleabihf' || matrix.target == 'riscv64gc-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-user

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add --toolchain 1.99.0 "$LDU_TARGET"

      - name: Build
        # Cargo.toml enables opt-level 3, full LTO, one codegen unit and symbol stripping.
        # Keep the target's baseline CPU and unwind support.
        run: cargo +1.99.0 build --locked --release --bin ldu --target "$LDU_TARGET"

      - name: Prepare the standalone executable
        run: python3 scripts/release.py package --target "$LDU_TARGET" --output dist

      - name: Test the final executable
        run: |
          release_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          python3 scripts/release.py smoke --target "$LDU_TARGET" --binary "dist/ldu-v${release_version}-${LDU_TARGET}" --runner-json "$LDU_SMOKE_RUNNER"

      - name: Upload the standalone executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
