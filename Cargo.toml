[package]
name = "ldu"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Live breadth-first disk usage"
repository = "https://github.com/SmallThingz/ldu"

[dependencies]
arc-swap = "1.7"
im = "15.1"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
crossterm = "0.28"
ctrlc = { version = "3.5", features = ["termination"] }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
