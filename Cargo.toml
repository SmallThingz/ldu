[package]
name = "ldu"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Live disk usage with effort-first scanning"
repository = "https://github.com/SmallThingz/ldu"

[dependencies]
arc-swap = "1.7"
im = "15.1"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
# Level-triggered polling preserves simultaneous resize and keyboard input.
crossterm = { version = "0.28", features = ["use-dev-tty"] }
ctrlc = { version = "3.5", features = ["termination"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "termios"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
